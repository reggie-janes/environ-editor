[project]
name = "environ-editor"
version = "0.1.0"
description = "Environment variables and PATH editor"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
build = [
    "nuitka>=2.4",
    "ordered-set",
]
test = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
