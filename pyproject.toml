[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "environ-editor"
version = "0.1.0"
description = "Environment variables and PATH editor"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
build = [
    "nuitka>=2.4",
    "ordered-set",
]
test = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[tool.hatch.build.targets.wheel]
packages = ["envedit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
