name: Install Qt system libraries
description: Install Linux system libraries required by PySide6/Qt

runs:
  using: composite
  steps:
    - name: Install Qt system libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgl1 libegl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
          libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
          libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
