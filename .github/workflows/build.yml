name: Build executables

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest -v

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build/build_linux.sh
            artifact_name: EnvEdit-linux-x86_64
            asset_path: EnvEdit-linux-x86_64.tar.gz
          - os: windows-latest
            script: build/build_windows.bat
            artifact_name: EnvEdit-windows-x86_64
            asset_path: EnvEdit-windows-x86_64.exe
          - os: macos-latest
            script: build/build_macos.sh
            artifact_name: EnvEdit-macos
            asset_path: EnvEdit-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt system libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies (Nuitka + pytest)
        run: uv sync --extra build --extra test

      - name: Run tests
        run: uv run pytest -v

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: uv run bash ${{ matrix.script }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: uv run ${{ matrix.script }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.asset_path }} EnvEdit

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: zip -r ${{ matrix.asset_path }} EnvEdit.app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv EnvEdit.exe ${{ matrix.asset_path }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
