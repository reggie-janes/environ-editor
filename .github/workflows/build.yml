name: Build executables

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Temporarily Windows-only while we iterate on PySide6 module
          # exclusions to shrink the bundle. Re-enable before tagging.
          # - os: ubuntu-latest
          #   script: build/build_linux.sh
          #   artifact_path: EnvEdit
          #   artifact_name: EnvEdit-linux
          - os: windows-latest
            script: build/build_windows.bat
            artifact_path: EnvEdit.exe
            artifact_name: EnvEdit-windows
          # - os: macos-latest
          #   script: build/build_macos.sh
          #   artifact_path: EnvEdit.app
          #   artifact_name: EnvEdit-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt system libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies (Nuitka + pytest)
        run: uv sync --extra build --extra test

      - name: Run tests
        run: uv run pytest -v

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: uv run bash ${{ matrix.script }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: uv run ${{ matrix.script }}

      - name: Inspect bundle contents (Windows diagnostic)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== Total size of main.dist ==="
          $total = (Get-ChildItem -Recurse main.dist | Measure-Object -Property Length -Sum).Sum
          "{0:N2} MB" -f ($total / 1MB)

          Write-Host "`n=== Top 50 largest files ==="
          Get-ChildItem -Recurse main.dist -File |
            Sort-Object Length -Descending |
            Select-Object -First 50 |
            Format-Table -AutoSize @{n='MB';e={[math]::Round($_.Length/1MB,2)}}, FullName

          Write-Host "`n=== Size per top-level directory ==="
          Get-ChildItem main.dist -Directory | ForEach-Object {
            $size = (Get-ChildItem -Recurse $_.FullName -File | Measure-Object -Property Length -Sum).Sum
            [PSCustomObject]@{ MB = [math]::Round($size/1MB,2); Path = $_.Name }
          } | Sort-Object MB -Descending | Format-Table -AutoSize

          Write-Host "`n=== Size of PySide6 subdirs (if present) ==="
          $pyside = Get-ChildItem -Recurse main.dist -Directory -Filter PySide6 | Select-Object -First 1
          if ($pyside) {
            Get-ChildItem $pyside.FullName -Directory | ForEach-Object {
              $size = (Get-ChildItem -Recurse $_.FullName -File | Measure-Object -Property Length -Sum).Sum
              [PSCustomObject]@{ MB = [math]::Round($size/1MB,2); Path = $_.Name }
            } | Sort-Object MB -Descending | Format-Table -AutoSize
          }

      # Upload disabled this iteration — we just need the diagnostic above.
      # - name: Upload artifact
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: ${{ matrix.artifact_name }}
      #     path: ${{ matrix.artifact_path }}
      #     if-no-files-found: error
